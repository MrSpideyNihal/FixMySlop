[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixmyslop"
version = "0.6.8"
description = "The slop linter for the AI-agent era: catch AI slop in UI and code in milliseconds, then let your agent fix it."
license = {text = "MIT"}
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "FixMySlop Contributors"},
]
keywords = ["ai-slop", "linter", "code-review", "claude-code", "mcp", "tailwind", "accessibility", "static-analysis", "security", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = []   # the app is now `fixmyslop ui` (browser-based, no extra dependencies)
analysis = ["ruff>=0.4.0", "bandit>=1.7.0"]
dev = ["pytest>=8.0.0", "flake8>=7.0.0"]

[project.scripts]
fixmyslop = "fixmyslop.main:main"

[project.urls]
Homepage = "https://github.com/MrSpideyNihal/FixMySlop"
Repository = "https://github.com/MrSpideyNihal/FixMySlop"

[tool.setuptools.packages.find]
where = ["."]
include = ["fixmyslop*"]

[tool.setuptools.package-data]
fixmyslop = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
